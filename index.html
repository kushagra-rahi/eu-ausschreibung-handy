<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ausschreibung">
<meta name="theme-color" content="#140A33">
<title>EU Ausschreibung</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0E0322; --card: rgba(34, 12, 78, 0.86); --line: rgba(200, 160, 255, 0.36); --text: #F6F0FF;
    --muted: #C9B8EA; --faint: #9584C2; --from: #C400FF; --to: #5B4BFF; --link: #E77BFF;
    --green: #2BEA4E; --orange: #F59E0B; --red: #EF4444; --gold: #FFD65A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  /* The glow sits on a layer fixed to the screen (2026-11-10, the user: "the background colour constantly changes when I
     change the Fachgebiet"): iPhone Safari ignores background-attachment: fixed, so a body background stretched over
     the page moved with every longer or shorter list. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(70% 45% at 0% 35%, #4A0E8C99, transparent 70%),
                radial-gradient(70% 45% at 100% 60%, #182A9C99, transparent 70%); }
  h1 { font-size: 24px; margin: 18px 0 4px; }
  h2 { font-size: 20px; margin: 18px 0 8px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .label { color: var(--muted); font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
  input, select { width: 100%; font: inherit; color: var(--text); background: rgba(255,255,255,0.06);
          border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none; }
  select { appearance: none; -webkit-appearance: none; }
  select option { background: #22104A; }
  input:focus, select:focus { border-color: var(--from); }
  button { font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 14px; padding: 11px 16px; cursor: pointer;
           background: linear-gradient(90deg, var(--from), var(--to)); }
  button.ghost { background: rgba(60, 16, 120, 0.45); border: 1px solid var(--line); }
  button:disabled { opacity: 0.6; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font-size: 26px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .seg button { flex: 1; border-radius: 0; background: transparent; padding: 9px 4px; font-size: 14px; }
  .seg button.on { background: linear-gradient(90deg, var(--from), var(--to)); }
  /* the filter cards of Suchen on the PC (2026-11-10, the user: "these two things mandatory in my Handy app") */
  .fcard { border: 1px solid rgba(205, 165, 255, 0.5); border-radius: 16px; margin: 12px 0; overflow: hidden;
           background: linear-gradient(135deg, rgba(34, 10, 76, 0.86), rgba(26, 30, 112, 0.80)); }
  .fhead { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-weight: 700; font-size: 16px;
           background: linear-gradient(90deg, #7800B7, #4A1A9A 60%, #2E3399); border-bottom: 1px solid #9C48C7; }
  .fhead .hint { margin-left: auto; font-weight: 400; font-size: 13px; color: #D6BDEB; }
  .fhead .pill { margin-left: auto; font-size: 13px; padding: 4px 12px; border-radius: 12px; border: 1px solid #F1B6FF;
                 background: linear-gradient(90deg, var(--from), var(--to)); }
  .fbody { padding: 10px 14px 12px; }
  .ticks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .ticks.three { grid-template-columns: 1fr 1fr 1fr; }
  .tick { display: flex; align-items: center; gap: 9px; background: transparent; border: 1px solid transparent;
          border-radius: 12px; padding: 9px 6px; text-align: left; font-weight: 400; font-size: 14.5px; }
  .tick .box { flex: 0 0 20px; height: 20px; border: 1.5px solid #B79BFF; border-radius: 6px; display: grid;
               place-items: center; font-size: 13px; font-weight: 800; }
  .tick svg { flex: 0 0 18px; width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7;
              stroke-linecap: round; stroke-linejoin: round; }
  .tick.on { background: linear-gradient(90deg, var(--from), var(--to)); font-weight: 700; }
  .tick.on .box { background: #fff; color: #8A1FE0; border-color: #fff; }
  .seg button.on::after { content: " ✓"; }
  .tender { display: flex; gap: 12px; }
  .ring { flex: 0 0 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
          border: 4px solid var(--green); color: var(--green); }
  .title { font-weight: 700; margin: 2px 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; border: 1px solid; }
  .b-gold { color: var(--gold); border-color: #8CFFD65A; background: #4E400C99; }
  .b-green { color: #7CF29E; border-color: #8C7CF29E; background: #104A2899; }
  .b-violet { color: #E9DAFF; border-color: #8CE9DAFF; background: #40167899; }
  .b-mint { color: #8CF5CF; border-color: #8C8CF5CF; background: #0E4A4099; }
  .days { color: var(--text); background: rgba(150, 50, 230, 0.45); border-color: rgba(215,150,255,.6); }
  .days.warn { color: #FCA5A5; }
  .saved { color: #7CF29E; font-weight: 600; }
  .thumb { background: rgba(60, 16, 120, 0.45); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; }
  .thumb.fit.on { background: #16A34A; border-color: #16A34A; }
  .thumb.nofit.on { background: #EA580C; border-color: #EA580C; }
  a { color: var(--link); }
  .sheet { position: fixed; inset: 0; background: rgba(8, 2, 20, 0.7); display: none; align-items: flex-end; z-index: 5; }
  .sheet.open { display: flex; }
  .sheet .card { width: 100%; max-height: 86vh; overflow: auto; margin: 0; border-radius: 20px 20px 0 0; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6;
           display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px;
           background: #22104A; border: 1px solid #B79BFF; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .toast span { flex: 1; font-weight: 600; }
  .err { color: #FCA5A5; }
  ul { padding-left: 18px; margin: 6px 0; }
</style>
</head>
<body>
  <p id="booting" class="muted" style="margin-top:40px; text-align:center">Wird geladen …</p>
  <section id="login" class="hidden">
    <h1>EU Ausschreibung</h1>
    <p class="muted">Bitte anmelden.</p>
    <div class="card">
      <input id="email" type="email" placeholder="E-Mail" autocomplete="username">
      <div style="height:10px"></div>
      <input id="password" type="password" placeholder="Passwort" autocomplete="current-password">
      <div style="height:12px"></div>
      <button id="loginBtn" style="width:100%">Anmelden</button>
      <p id="loginErr" class="err small"></p>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="row" style="justify-content:space-between">
      <h1>Übersicht</h1>
      <span class="row"><button id="refreshBtn" class="ghost small">↻ Aktualisieren</button>
      <button id="logoutBtn" class="ghost small">Abmelden</button></span>
    </div>
    <p class="small" style="margin:2px 0 0">Angemeldet als <b id="who"></b></p>
    <p id="updated" class="muted small"></p>
    <div class="kpis">
      <div class="kpi"><b id="kNew">–</b><span class="muted small">neu in 7 Tagen</span></div>
      <div class="kpi"><b id="kGold">–</b><span class="muted small">Goldfunde</span></div>
      <div class="kpi"><b id="kSoon">–</b><span class="muted small">Frist in 7 Tagen</span></div>
      <div class="kpi"><b id="kSaved">–</b><span class="muted small">gespeichert</span></div>
    </div>

    <h2>Suchen</h2>
    <input id="q" type="search" placeholder="Titel, Auftraggeber, Ort …">
    <div class="label">Ansicht</div>
    <div class="seg" id="segView"></div>
    <div class="label">Zeitraum</div>
    <div class="seg" id="segPeriod"></div>
    <select id="sort" style="margin-top:12px">
      <option value="score">Sortieren: Score ↓</option>
      <option value="deadline">Sortieren: Frist ↑</option>
      <option value="new">Sortieren: Neueste</option>
    </select>

    <div class="fcard">
      <div class="fhead"><span>Fachgebiet</span><span class="hint">Mehrfachauswahl möglich</span></div>
      <div class="fbody"><div class="ticks" id="ticksFach"></div></div>
    </div>
    <div class="fcard">
      <div class="fhead"><span>Leistungsphase (LPH)</span><span class="pill" id="phasePill">alle Phasen</span></div>
      <div class="fbody"><div class="ticks three" id="ticksPhase"></div></div>
    </div>
    <div class="fcard">
      <div class="fhead"><span>Frist noch (Wochen)</span></div>
      <div class="fbody"><div class="seg" id="segDeadline"></div></div>
    </div>
    <div class="fcard">
      <div class="fhead"><span>Land</span></div>
      <div class="fbody"><div class="seg" id="segCountry"></div></div>
    </div>
    <button id="resetBtn" class="ghost" style="width:100%">↺ Filter zurücksetzen</button>

    <div class="seg" id="segList" style="margin-top:14px"></div>
    <p id="count" class="muted small"></p>
    <div id="list"></div>
  </section>

  <div id="sheet" class="sheet"><div class="card" id="detail"></div></div>
  <div id="toast" class="toast hidden"><span id="toastText"></span><button id="toastUndo" class="ghost">↶ Rückgängig</button></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const cfg = window.TB_CONFIG;
// Stay logged in until "Abmelden" (2026-11-10, the user): the login is kept on the phone and renewed in the background.
// The storage key stays Supabase's default, so nobody is logged out by an update of this page.
const db = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey,
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
const $ = (id) => document.getElementById(id);
let tenders = [];
const pending = new Set();  // saved on this phone, not yet taken over by the PC
const unsaved = new Set();  // saving undone on this phone ("Rückgängig"), not yet taken over by the PC
let listMode = "results";  // "results" or "saved" (the switch above the list)
const thumbsLocal = new Map();  // 👍 / 👎 tapped on this phone, not yet taken over: publication number → label or null
let myName = "";  // as the PC knows this person: the login's name, else its e-mail

// The same choices and defaults as Suchen on the PC.
const VIEWS = [["kern", "LPH 5–8"], ["mit_planung", "+ Planung 1–4"], ["alle", "Alle Treffer"]];
const PERIODS = [[14, "2 Wochen"], [28, "4 Wochen"], [42, "6 Wochen"]];
const FACH = [["tiefbau", "Tiefbau"], ["hochbau", "Hochbau"], ["elektro", "Elektro / TGA"], ["energie", "Energie & Netze"],
              ["zaehler", "Zähler & Messstellen"], ["pipeline", "Pipeline"], ["engineering", "Engineering"],
              ["architektur", "Architektur"]];
const PHASES = [[7, "LPH 7"], [8, "LPH 8"], [9, "LPH 9"]];
const DEADLINES = [[0, "alle"], [1, "≥ 1"], [2, "≥ 2"], [3, "≥ 3"], [4, "≥ 4"]];
const COUNTRIES = [["", "DE + AT"], ["DEU", "DE"], ["AUT", "AT"]];
const ICONS = {  // 24×24 line drawings, drawn in the text colour
  tiefbau: "M5 16h14M6 16l1.5-5h9L18 16M7 19.5v-3.5M17 19.5v-3.5M8.5 13.5h.01M15.5 13.5h.01",
  hochbau: "M4 11l8-7 8 7M6 10v10h12V10M10 20v-6h4v6",
  elektro: "M13 3L5 14h6l-1 7 8-11h-6z",
  energie: "M5 19c8 0 14-6 14-14C11 5 5 10 5 17zM5 19l7-7",
  zaehler: "M4 15a8 8 0 0 1 16 0M12 15l4-5M8 18h8",
  pipeline: "M12 3c3 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-6.5 6-11z",
  engineering: "M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1",
  architektur: "M12 3l-6 18M12 3l6 18M8.5 14h7M12 3v3",
};
const PHASE_FREE = ["zaehler"];  // meter swaps have no LPH: shown in the LPH views too
const DEFAULTS = { view: "kern", period: 28, fach: [], phases: [], deadline: 0, country: "", sort: "score" };
let f = loadFilters();

function loadFilters() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("tb_filters") || "{}") }; } catch (e) { return { ...DEFAULTS }; }
}
function saveFilters() { try { localStorage.setItem("tb_filters", JSON.stringify(f)); } catch (e) { /* private mode */ } }

/** An element with plain text only (texts from TED are never treated as HTML). */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function berlinDay(d) {
  const p = new Date(d.toLocaleString("en-US", { timeZone: "Europe/Berlin" }));
  return new Date(p.getFullYear(), p.getMonth(), p.getDate());
}
function daysLeft(deadline) {
  return deadline ? Math.round((berlinDay(new Date(deadline)) - berlinDay(new Date())) / 86400000) : null;
}
function countdown(deadline) {
  const d = daysLeft(deadline);
  if (d === null) return null;
  if (d < 0) return { text: "abgelaufen", warn: true };
  if (d === 0) return { text: "heute", warn: true };
  if (d === 1) return { text: "morgen", warn: true };
  return { text: `noch ${d} Tage`, warn: d <= 3 };
}
function fmtDate(value) {
  if (!value) return "nicht angegeben";
  return new Date(value).toLocaleString("de-DE", { timeZone: "Europe/Berlin", weekday: "short", day: "2-digit",
    month: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function ringColor(score) { return score >= 70 ? "var(--green)" : score >= 40 ? "var(--orange)" : "var(--red)"; }
/** The status as this phone knows it: the PC's, changed by what was tapped here and not yet taken over. */
function status(t) {
  if (unsaved.has(t.publication_number)) return "new";
  if (pending.has(t.publication_number)) return "saved";
  return t.status;
}
function isSaved(t) { return status(t) !== "new"; }

/** The PC's rules: view, period (German date), Fachgebiet, phases, deadline, country, search text. */
function passes(t, words) {
  const fach = t.bereiche || [];
  const phaseFree = fach.some((b) => PHASE_FREE.includes(b));
  const groups = f.view === "kern" ? ["kern"] : f.view === "mit_planung" ? ["kern", "mit_planung"] : null;
  if (groups && !words.length && !groups.includes(t.phase_group) && !phaseFree) return false;
  if (t.published) {
    const since = berlinDay(new Date());
    since.setDate(since.getDate() - f.period);
    if (new Date(t.published + "T12:00:00") < since) return false;
  }
  if (f.fach.length && !f.fach.some((k) => fach.includes(k))) return false;
  if (f.phases.length && !f.phases.some((p) => (t.phases || []).includes(p))) return false;
  if (f.deadline) {
    if (!t.deadline || new Date(t.deadline) < new Date(Date.now() + f.deadline * 7 * 86400000)) return false;
  }
  if (f.country && t.country !== f.country) return false;
  const hay = `${t.title || ""} ${t.buyer || ""} ${t.description || ""}`.toLowerCase();
  return words.every((w) => hay.includes(w));
}

function sorted(list) {
  const by = {
    score: (a, b) => (b.score || 0) - (a.score || 0) || String(a.deadline).localeCompare(String(b.deadline)),
    deadline: (a, b) => String(a.deadline || "9").localeCompare(String(b.deadline || "9")),
    new: (a, b) => String(b.published || "").localeCompare(String(a.published || "")),
  }[f.sort];
  return [...list].sort(by);
}

function render() {
  const words = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
  // as on the PC, tenders already saved or in work are no search results (saved here just now: still shown)
  const savedList = tenders.filter(isSaved);
  seg("segList", [["results", "Treffer"], ["saved", `Gespeichert (${savedList.length})`]], listMode, (v) => { listMode = v; });
  const shown = listMode === "saved" ? sorted(savedList)
    : sorted(tenders.filter((t) => (t.status === "new" || unsaved.has(t.publication_number)) && passes(t, words)));
  $("count").textContent = listMode === "saved"
    ? (shown.length ? `${shown.length} gespeichert – „Rückgängig“ nimmt eine Speicherung zurück` : "Noch nichts gespeichert.")
    : `${shown.length} Ausschreibungen`;
  const list = $("list");
  list.replaceChildren();
  for (const t of shown.slice(0, 200)) list.appendChild(card(t));
  const weekAgo = Date.now() - 7 * 86400000;
  $("kNew").textContent = tenders.filter((t) => t.published && new Date(t.published) >= weekAgo).length;
  $("kGold").textContent = tenders.filter((t) => t.gold && t.status === "new").length;
  $("kSoon").textContent = tenders.filter((t) => { const d = daysLeft(t.deadline); return d !== null && d >= 0 && d <= 7; }).length;
  $("kSaved").textContent = savedList.length;
  renderControls();
}

function seg(id, options, current, set) {
  const box = $(id);
  box.replaceChildren();
  for (const [value, label] of options) {
    const b = el("button", value === current ? "on" : "", label);
    b.onclick = () => { set(value); saveFilters(); render(); };
    box.appendChild(b);
  }
}
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[name] || "");
  svg.appendChild(path);
  return svg;
}
function ticks(id, options, chosen, key) {
  const box = $(id);
  box.replaceChildren();
  for (const [value, label] of options) {
    const on = chosen.includes(value);
    const b = el("button", "tick" + (on ? " on" : ""));
    b.appendChild(el("span", "box", on ? "✓" : ""));
    if (ICONS[value]) b.appendChild(icon(value));
    b.appendChild(el("span", "", label));
    b.onclick = () => {
      f[key] = chosen.includes(value) ? chosen.filter((v) => v !== value) : [...chosen, value];
      saveFilters(); render();
    };
    box.appendChild(b);
  }
}
function renderControls() {
  seg("segView", VIEWS, f.view, (v) => { f.view = v; });
  seg("segPeriod", PERIODS, f.period, (v) => { f.period = v; });
  seg("segDeadline", DEADLINES, f.deadline, (v) => { f.deadline = v; });
  seg("segCountry", COUNTRIES, f.country, (v) => { f.country = v; });
  ticks("ticksFach", FACH, f.fach, "fach");
  ticks("ticksPhase", PHASES, f.phases, "phases");
  $("phasePill").textContent = f.phases.length ? "LPH " + [...f.phases].sort().join(" + ") : "alle Phasen";
  $("sort").value = f.sort;
}

function badges(t) {
  const box = el("div", "badges");
  if (t.gold) box.appendChild(el("span", "badge b-gold", "🏆 Goldfund"));
  if (t.phase_label) box.appendChild(el("span", "badge b-green", t.phase_label));
  if (t.bereich_label) box.appendChild(el("span", "badge b-mint", t.bereich_label));
  if (t.leistung_label) box.appendChild(el("span", "badge b-violet", t.leistung_label));
  const c = countdown(t.deadline);
  if (c) box.appendChild(el("span", "badge days" + (c.warn ? " warn" : ""), c.text));
  return box;
}

function card(t) {
  const c = el("div", "card tender");
  const ring = el("div", "ring", String(t.score ?? 0));
  ring.style.borderColor = ring.style.color = ringColor(t.score || 0);
  const body = el("div");
  body.style.minWidth = "0";
  body.append(badges(t), el("div", "title", t.title || "(ohne Titel)"), el("div", "muted small", t.buyer || ""));
  body.appendChild(el("div", "small", `Frist ${fmtDate(t.deadline)}`));
  const row = el("div", "row");
  row.style.marginTop = "8px";
  row.appendChild(saveButton(t));
  const more = el("button", "ghost", "Details");
  more.onclick = () => openDetail(t);
  row.append(more, thumbs(t));
  body.appendChild(row);
  c.append(ring, body);
  return c;
}

function myThumb(t) {
  return thumbsLocal.has(t.publication_number) ? thumbsLocal.get(t.publication_number) : ((t.feedback || {})[myName] || null);
}

/** 👍 / 👎 like on the PC: in this person's name, a second tap removes it; the PC takes it over at its next sync. */
function thumbs(t) {
  const box = el("span", "row");
  for (const [label, text, cls] of [["passt", "👍", "fit"], ["passt_nicht", "👎", "nofit"]]) {
    const b = el("button", `thumb ${cls}` + (myThumb(t) === label ? " on" : ""), text);
    b.title = label === "passt" ? "Passt" : "Passt nicht";
    b.onclick = async () => {
      const next = myThumb(t) === label ? null : label;
      b.disabled = true;
      const { error } = await db.from("actions").insert({ publication_number: t.publication_number,
                                                           action: next || "clear_feedback" });
      b.disabled = false;
      if (error) { alert("Die Bewertung hat nicht geklappt. Bitte noch einmal versuchen."); return; }
      thumbsLocal.set(t.publication_number, next);
      render();
      if ($("sheet").classList.contains("open")) openDetail(t);
    };
    box.appendChild(b);
  }
  return box;
}

async function act(t, action) {
  const { error } = await db.from("actions").insert({ publication_number: t.publication_number, action });
  if (error) { alert("Das hat nicht geklappt. Bitte noch einmal versuchen."); return false; }
  return true;
}

function refreshAfter(t) {
  render();
  if ($("sheet").classList.contains("open")) openDetail(t);
}

/** Speichern; once saved "✓ Gespeichert" with "Rückgängig" (2026-11-10, the user: "if we do it by mistake we want to
 * undo it") – the PC takes it back at its next sync, unless it is already worked on there. */
function saveButton(t) {
  const pn = t.publication_number;
  if (isSaved(t)) {
    if (status(t) !== "saved") return el("span", "saved", "✓ In Arbeit am PC");
    const box = el("span", "row");
    box.appendChild(el("span", "saved", pending.has(pn) && t.status === "new"
      ? "✓ Gespeichert – erscheint am PC unter „2 Unterlagen“ nach dem nächsten Abgleich" : "✓ Gespeichert"));
    const undo = el("button", "ghost", "↶ Rückgängig");
    undo.onclick = async () => { undo.disabled = true; if (!(await undoSave(t))) undo.disabled = false; };
    box.appendChild(undo);
    return box;
  }
  const b = el("button", "", "☆ Speichern");
  b.onclick = async () => {
    b.disabled = true;
    if (!(await act(t, "save"))) { b.disabled = false; return; }
    unsaved.delete(pn);
    if (t.status === "new") pending.add(pn);
    refreshAfter(t);
    toast(`Gespeichert: ${t.title || pn}`, t);
  };
  return b;
}

async function undoSave(t) {
  if (!(await act(t, "unsave"))) return false;
  pending.delete(t.publication_number);
  if (t.status !== "new") unsaved.add(t.publication_number);
  refreshAfter(t);
  return true;
}

let toastTimer = null;
/** "Gespeichert · Rückgängig" for 6 seconds after saving – a save by mistake is undone with one tap. */
function toast(text, t) {
  $("toastText").textContent = text.length > 70 ? text.slice(0, 68) + " …" : text;
  $("toast").classList.remove("hidden");
  $("toastUndo").onclick = async () => { $("toast").classList.add("hidden"); await undoSave(t); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 6000);
}

function openDetail(t) {
  const d = $("detail");
  d.replaceChildren();
  const close = el("button", "ghost", "Schließen");
  close.onclick = () => $("sheet").classList.remove("open");
  d.append(badges(t), el("h1", "", t.title || "(ohne Titel)"),
           el("div", "muted", `${t.buyer || ""} · ${t.country === "AUT" ? "Österreich" : "Deutschland"}`));
  const facts = el("div", "small");
  facts.style.margin = "10px 0";
  for (const line of [`Frist: ${fmtDate(t.deadline)}`, `Laufzeit: ${t.duration_text || "nicht angegeben"}`,
                      `Wert: ${t.value_text || "nicht angegeben"}`, `Score: ${t.score ?? 0}`]) {
    facts.appendChild(el("div", "", line));
  }
  d.appendChild(facts);
  if (t.description) d.appendChild(el("p", "small", t.description));
  if ((t.reasons || []).length) {
    d.appendChild(el("div", "muted small", "Warum dieser Score?"));
    const ul = el("ul", "small");
    for (const r of t.reasons) ul.appendChild(el("li", "", `${r.points > 0 ? "+" : ""}${r.points} ${r.text}`));
    d.appendChild(ul);
  }
  const row = el("div", "row");
  row.append(saveButton(t), thumbs(t));
  const ted = el("a", "", "Auf TED öffnen ↗");
  ted.href = t.ted_url; ted.target = "_blank"; ted.rel = "noopener";
  row.append(ted, close);
  d.appendChild(row);
  $("sheet").classList.add("open");
}

let loadedAt = 0;
async function load() {
  loadedAt = Date.now();
  $("refreshBtn").disabled = true;
  const { data, error } = await db.from("tenders").select("*").order("score", { ascending: false }).limit(3000);
  $("refreshBtn").disabled = false;
  if (error) { $("count").textContent = "Die Liste konnte nicht geladen werden."; return; }
  tenders = data || [];
  // what was tapped here and not yet taken over by the PC: rebuilt from this phone's open actions
  pending.clear(); unsaved.clear(); thumbsLocal.clear();
  const mine = await db.from("actions").select("publication_number, action").is("picked_up_at", null).order("id");
  for (const a of mine.data || []) {
    const t = tenders.find((x) => x.publication_number === a.publication_number);
    if (a.action === "save") { unsaved.delete(a.publication_number); if (!t || t.status === "new") pending.add(a.publication_number); }
    else if (a.action === "unsave") { pending.delete(a.publication_number); if (t && t.status !== "new") unsaved.add(a.publication_number); }
    else if (a.action === "passt" || a.action === "passt_nicht") thumbsLocal.set(a.publication_number, a.action);
    else if (a.action === "clear_feedback") thumbsLocal.set(a.publication_number, null);
  }
  const last = tenders.reduce((m, t) => (t.uploaded_at > m ? t.uploaded_at : m), "");
  $("updated").textContent = last ? `Stand: ${fmtDate(last)} (aktualisiert bei jedem Abgleich am PC)` : "Noch keine Daten vom PC.";
  render();
}

async function show() {
  // never a blank page (2026-11-10, "it's not loading"): "Wird geladen …" while the stored login is checked, and the
  // login screen when the check fails or takes longer than 8 seconds (no network)
  let data = { session: null };
  try {
    const timeout = new Promise((resolve) => setTimeout(() => resolve({ data: { session: null }, slow: true }), 8000));
    const r = await Promise.race([db.auth.getSession(), timeout]);
    data = r.data || data;
    if (r.slow) $("loginErr").textContent = "Keine Verbindung – bitte Internet prüfen und neu öffnen.";
  } catch (e) {
    $("loginErr").textContent = "Keine Verbindung – bitte Internet prüfen und neu öffnen.";
  }
  $("booting").classList.add("hidden");
  const loggedIn = !!data.session;
  const user = data.session && data.session.user;
  myName = user ? ((user.user_metadata && user.user_metadata.name) || user.email || "") : "";
  $("who").textContent = myName;
  $("login").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
  if (loggedIn) load();
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) { $("loginErr").textContent = "Anmeldung fehlgeschlagen – E-Mail oder Passwort prüfen."; return; }
  show();
};
$("logoutBtn").onclick = async () => {
  if (!confirm("Wirklich abmelden? Danach müssen E-Mail und Passwort neu eingegeben werden.")) return;
  await db.auth.signOut();
  show();
};
// a login that became invalid (e.g. the password was changed in Supabase) brings back the login screen
db.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") show(); });
// "Aktualisieren" (2026-11-10): the newest upload of the PC – an app on the home screen has no reload of its own;
// it also reloads by itself when it comes back to the front after a while
$("refreshBtn").onclick = () => load();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !$("app").classList.contains("hidden") && Date.now() - loadedAt > 30000) load();
});
$("q").oninput = render;
$("sort").onchange = () => { f.sort = $("sort").value; saveFilters(); render(); };
$("resetBtn").onclick = () => { f = { ...DEFAULTS }; saveFilters(); render(); };
$("sheet").onclick = (e) => { if (e.target.id === "sheet") $("sheet").classList.remove("open"); };
show();
</script>
</body>
